<main>
    <div id="animais-modal"></div>
    <div id="busca-container">
        <div>
            <input type="text" id="busca-input" placeholder="Pesquisar por nome, tipo, raça, cor ou descrição...">
        </div>
        <div>
            <button type="button" id="btn-filtros">Filtros &#9660;</button>
            <div id="filtros-dropdown">
                <div>
                    <strong>Porte</strong>
                    <label><input type="checkbox" data-filtro="porte" value="Pequeno"> Pequeno</label>
                    <label><input type="checkbox" data-filtro="porte" value="Médio"> Médio</label>
                    <label><input type="checkbox" data-filtro="porte" value="Grande"> Grande</label>
                </div>
                <div>
                    <strong>Cor</strong>
                    <label><input type="checkbox" data-filtro="cor" value="Preto"> Preto</label>
                    <label><input type="checkbox" data-filtro="cor" value="Branco"> Branco</label>
                    <label><input type="checkbox" data-filtro="cor" value="Marrom"> Marrom</label>
                    <label><input type="checkbox" data-filtro="cor" value="Cinza"> Cinza</label>
                    <label><input type="checkbox" data-filtro="cor" value="Outro"> Outro</label>
                </div>
                <div>
                    <strong>Tipo</strong>
                    <label><input type="checkbox" data-filtro="tipo" value="Cachorro"> Cachorro</label>
                    <label><input type="checkbox" data-filtro="tipo" value="Gato"> Gato</label>
                    <label><input type="checkbox" data-filtro="tipo" value="Cavalo"> Cavalo</label>
                    <label><input type="checkbox" data-filtro="tipo" value="Outro"> Outro</label>
                </div>
                <div>
                    <strong>Vacinado</strong>
                    <label><input type="checkbox" data-filtro="vacinado" value="1"> Sim</label>
                    <label><input type="checkbox" data-filtro="vacinado" value="0"> Não</label>
                </div>
                <div>
                    <strong>Certificado</strong>
                    <label><input type="checkbox" data-filtro="certificado" value="1"> Sim</label>
                    <label><input type="checkbox" data-filtro="certificado" value="0"> Não</label>
                </div>
                <button type="button" id="btn-limpar-filtros">Limpar Filtros</button>
            </div>
        </div>
    </div>
    <div id="animais-container"></div>
    <div id="animais-pagination"></div>
</main>
<script src="/frontEnd/utils/usuarioSalvos.js"></script>
<script src="/frontEnd/utils/app.js"></script>
