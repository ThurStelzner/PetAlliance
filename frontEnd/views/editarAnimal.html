<script>
    const fotosAtuais = document.getElementById('fotos-atuais');

    fotosAtuais.addEventListener('click', async function(e) {
        const btn = e.target.closest('.btn-remove-foto-existente');
        if (!btn) return;
        if (!confirm('Remover esta foto?')) return;

        const fotoPath = btn.dataset.fotoPath;
        const div = btn.closest('[data-foto-path]');

        try {
            const resp = await fetch('/backEnd/home.php?route=remover_foto', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    pet_id: <?= $animal->getId() ?>,
                    foto_path: fotoPath
                }),
                credentials: 'same-origin'
            });
            const data = await resp.json();
            if (data.success) {
                div.remove();
            } else {
                alert('Erro: ' + (data.error || 'Erro desconhecido'));
            }
        } catch (err) {
            alert('Erro de conexÃ£o.');
        }
    });

    document.getElementById('btn-add-nova-foto').addEventListener('click', function() {
        const container = document.getElementById('novas-fotos-container');
        const group = document.createElement('div');
        group.className = 'foto-input-group';
        group.innerHTML = '<input type="file" name="novas_fotos[]" accept="image/jpeg,image/png,image/webp">';
        container.appendChild(group);
    });
</script>
