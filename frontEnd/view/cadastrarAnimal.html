<form method="POST" enctype="multipart/form-data">
    <h1>Cadastro de Animal</h1>

    <label for="nome">Nome do animal:</label>
    <input type="text" name="nome" id="nome" minlength="3" maxlength="80" placeholder="Nome do animal" required>


    <label for="tipo">Tipo de animal:</label>
    <input type="text" name="tipo" id="tipo" minlength="3" maxlength="80" placeholder="Tipo do animal" required>


    <label for="raca">Raça:</label>
    <input type="text" name="raca" id="raca" minlength="3" maxlength="80" placeholder="Raça" required>

    <label for="cor">Cor:</label>
    <input type="text" name="cor" id="cor" minlength="3" maxlength="80" placeholder="Cor" required>

    <label for="sexo">Sexo:</label>
    <select name="sexo" id="sexo" required>
        <option value="" selected disabled>Selecione</option>
        <option value="Macho">Macho</option>
        <option value="Fêmea">Fêmea</option>
    </select>

    <label for="porte">Porte:</label>
    <select name="porte" id="porte" required>
        <option value="" selected disabled>Selecione</option>
        <option value="Pequeno">Pequeno</option>
        <option value="Médio">Médio</option>
        <option value="Grande">Grande</option>
    </select>

    <label for="dt_nascimento">Data de Nascimento:</label>
    <input type="date" name="dt_nascimento" id="dt_nascimento" required>

    <label for="peso">Peso:</label>
    <input type="number" step="0.01" name="peso" id="peso" placeholder="Peso" required>

    <label for="descricao">Descrição:</label>
    <textarea name="descricao" id="descricao" placeholder="Descrição"></textarea>

    <label for="vacinado" >Vacinado?</label>
    <select id="vacinado" name="vacinado" required>
        <option value="" style="display: none;" selected disabled>Sim ou não</option>
        <option value="1">Sim</option>
        <option value="0">Não</option>
    </select>

    <label for="certificado" >Possui Certificado de raça?</label>
    <select id="certificado" name="certificado" required>
        <option value="" style="display: none;" selected disabled>Sim ou não</option>
        <option value="1">Sim</option>
        <option value="0">Não</option>
    </select>

    <div id="campoCertificado" style="display:none;">
        <label for="arquivoCertificado">Enviar Certificado:</label>
        <input type="file" name="arquivoCertificado" id="arquivoCertificado" required>
    </div>

    <div id="campoVacinacao" style="display:none;">
        <label for="arquivoVacinacao">Enviar carteira de vacinação:</label>
        <input type="file" name="arquivoVacinacao" id="arquivoVacinacao" required>
    </div>

    <button type="submit">Cadastrar</button>
</form>

<script src="../../frontEnd/utils/animalSalvos.js"></script>
<script src="../../frontEnd/utils/animalFuncoes.js"></script>
