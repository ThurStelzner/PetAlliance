services:
  php:
    build:
      context: .
      dockerfile: docker/dockerfile
    ports:
      - "8080:80"
    volumes:
      - ./uploads:/var/www/html/uploads
    env_file:
      - .env
    depends_on:
      - db
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: pet_alliance_db
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppass
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3307:3306"
volumes:
  db_data:

