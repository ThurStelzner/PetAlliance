services:
  php:
    image: petalliance-web:1.0
    build:
      context: .
      dockerfile: docker/dockerfile
    container_name: petalliance-web
    ports:
      - "8080:80"
    volumes:
      - ./uploads:/var/www/html/uploads
    env_file:
      - .env
    depends_on:
      - db
    networks:
      - petNetwork
  db:
    image: mysql:8.0
    container_name: petalliance-db
    # PHP usa America/Sao_Paulo (config.php); sem isso o MySQL do Docker fica em UTC e os
    # codigos de verificacao (expiracao > NOW()) nascem expirados. Brasil nao tem mais horario de verao.
    command: "--default-time-zone=-03:00"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: pet_alliance_db
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppass
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3307:3306"
    networks:
      - petNetwork
volumes:
  db_data:
networks:
  petNetwork:
    driver: bridge
